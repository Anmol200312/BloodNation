<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <!-- Google Fonts & CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: linear-gradient(to right, rgb(165, 118, 165), purple);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 24px;
            font-weight: 700;
            text-decoration: none;
            color: purple;
            font-family: 'Poppins', sans-serif;
        }

        .logo span {
            color: purple;
        }


        .heart-icon {
            color: red;
            font-size: 18px;
        }

        .logo:hover,
        .logo:active {
            color: #f8a5c2;
        }

        .container {
            width: 600px;
            height: 200px;
            border-radius: 8px;
            padding: 20px;
            background-color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        #resetForm {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: center;
            width: 100%;
            height: 200px;
        }

        .resetDiv {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-top: auto;
            margin-bottom: auto;
            gap: 10px;
            width: 100%;
        }

        .resetDiv label {
            width: 80px;
            font-weight: lighter;
        }

        .resetDiv input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            color: rgb(138, 43, 226);
        }

        .resetDiv input:focus {
            outline: none;
            border-color: purple;
            background-color: #fdf6fd;
        }

        #resetButton {
            background-color: blueviolet;
            border: 1px solid rgb(69, 69, 229);
            padding: 4px;
            border-radius: 4px;
            width: 100%;
            color: white;
        }

        #resetButton:hover,
        #resetButton:focus {
            outline: none;
            background-color: purple;
            border-color: rgb(69, 69, 229);
            box-shadow: 0 0 8px rgba(138, 43, 226, 0.5);
        }

        #resetButton:active {
            transform: scale(0.98);
        }
    </style>
</head>

<body>
    <div class="container">
        <a class="logo" href="/">Blood<span>Nation</span>❤️</a>
        <form id="resetForm">
            <div class="resetDiv">
                <label for="resetEmail">Email</label>
                <input type="email" id="resetEmail" required>
            </div>
            <button type="submit" id="resetButton">Send email</button>
        </form>
    </div>

    <script src="JS/auth.js"></script>
    <script src="JS/reset_password.js"></script>
</body>

</html>
