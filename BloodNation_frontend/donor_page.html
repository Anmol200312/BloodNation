<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Dashboard</title>
    <!-- Google Fonts & CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CSS/donor_page.css">
</head>

<body>
    <header class="notranslate">
        <a class="logo" href="/">Blood<span>Nation</span>❤️</a>
        <nav>
            <ul class="navlist">
                <li><a href="home_page.html">Home</a></li>
                <li><a href="change_password.html">Reset Password</a></li>
                <li><button id="logoutDon">Logout</button></li>
                <li>
                    <div class="gtranslate_wrapper"></div>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <h2></h2>
        <hr>
        <h3 class="headingTop">Profile</h3>
        <div class="donorDiv" id="profileDon"></div>
        <hr>
        <div class="selectDiv">
            <h3 class="headingBottom">Matched Requests</h3>
            <div class="inputDiv"><input type="text" id="inputMatch" placeholder="Filter" autocomplete="off"></div>
        </div>
        <div class="donorDiv" id="matchDon"></div>
        <hr>
        <div class="selectDiv">
            <h3 class="headingBottom">My accepted donations</h3>
            <div class="inputDiv"><input type="text" id="inputDon" placeholder="Filter" autocomplete="off"></div>
        </div>
        <div class="donorDiv" id="donationDon"></div>
    </main>

    <script src="JS/auth.js"></script>
    <script src="JS/donor_page.js"></script>
    <script>window.gtranslateSettings = { "default_language": "en", "detect_browser_language": true, "languages": ["en", "hi"], "wrapper_selector": ".gtranslate_wrapper" }</script>
    <script src="https://cdn.gtranslate.net/widgets/latest/ln.js" defer></script>
</body>

</html>
