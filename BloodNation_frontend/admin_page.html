<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <!-- Google Fonts & CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="CSS/cropper.min.css">
    <link rel="stylesheet" href="CSS/admin_page.css">
</head>

<body>
    <header class="notranslate">
        <a class="logo" href="/">Blood<span>Nation</span>❤️</a>
        <nav>
            <ul class="navlist">
                <li><a href="home_page.html">Home</a></li>
                <li><a href="change_password.html">Reset Password</a></li>
                <li><button id="logoutAdmin">Logout</button></li>
                <li>
                    <div class="gtranslate_wrapper"></div>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <h2></h2>
        <hr>
        <h3 class="headingTop">Profile</h3>
        <div class="picDiv">
            <div id="profileDiv"></div>
            <div id="profileContainer" style="display: none;">
                <div id="closePic">x</div>
                <form id="profileForm"><input type="file" id="profileInput" accept="image/*">
                    <div id="cropBox" style="width: 100%; height: 120px; display: none; overflow: hidden;">
                        <img id="previewImage" style="max-width: 100%; display: block;">
                    </div>
                    <button type="submit" id="picButton">Update</button>
                </form>
            </div>
        </div>

        <div class="adminDiv" id="profileAdmin">
        </div>
        <hr>
        <h3 class="headingTop">Statistics</h3>
        <div class="adminDiv" id="statsAdmin">
            <div class="statsDiv" id="totalHos"></div>
            <div class="statsDiv" id="totalDoc"></div>
            <div class="statsDiv" id="totalDon"></div>
            <div class="statsDiv" id="totalPat"></div>
            <div class="statsDiv" id="totalReq"></div>
            <div class="statsDiv" id="completeReq"></div>
            <div class="statsDiv" id="leftReq"></div>
        </div>
        <hr>
        <div class="selectDiv">
            <h3 class="headingBottom">Hospitals</h3>
            <div class="inputDiv"><input type="text" id="inputHos" placeholder="Filter" autocomplete="off"></div>
        </div>
        <div class="adminDiv" id="hospitalsAdmin"></div>
        <hr>

        <div class="selectDiv">
            <h3 class="headingBottom">Users</h3>
            <div class="inputDiv"><input type="text" id="inputUsers" placeholder="Filter" autocomplete="off"></div>
        </div>
        <div class="adminDiv" id="usersAdmin"></div>
        <hr>

        <div class="selectDiv">
            <h3 class="headingBottom">Blood Requests</h3>
            <div class="inputDiv"><input type="text" id="inputReq" placeholder="Filter" autocomplete="off"></div>
        </div>
        <div class="adminDiv" id="requestAdmin"></div>
        <hr>

        <div class="selectDiv">
            <h3 class="headingBottom">Donation Reqeusts</h3>
            <div class="inputDiv"><input type="text" id="inputDon" placeholder="Filter" autocomplete="off"></div>
        </div>
        <div class="adminDiv" id="donationAdmin"></div>
    </main>
    <script src="JS/cropper.min.js"></script>
    <script src="JS/auth.js"></script>
    <script src="JS/profile_pic.js"></script>
    <script src="JS/admin_page.js"></script>
    <script>window.gtranslateSettings = { "default_language": "en", "detect_browser_language": true, "languages": ["en", "hi"], "wrapper_selector": ".gtranslate_wrapper" }</script>
    <script src="https://cdn.gtranslate.net/widgets/latest/ln.js" defer></script>
</body>

</html>
