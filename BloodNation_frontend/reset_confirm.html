<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Password</title>
    <!-- Google Fonts & CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: linear-gradient(to right, rgb(165, 118, 165), purple);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 24px;
            font-weight: 700;
            text-decoration: none;
            color: purple;
            font-family: 'Poppins', sans-serif;
        }

        .logo span {
            color: purple;
        }


        .heart-icon {
            color: red;
            font-size: 18px;
        }

        .logo:hover,
        .logo:active {
            color: #f8a5c2;
        }

        .container {
            width: 600px;
            height: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
        }

        #confirmHeading {
            align-items: center;
            font-size: x-large;
            color: rgb(138, 43, 226);
            margin-top: 20px;
        }

        #confirmForm {
            width: 100%;
            height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: stretch;
        }

        .updateDiv {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            margin-top: auto;
            margin-bottom: auto;
            gap: 10px;
        }

        .updateDiv label {
            width: 120px;
            font-weight: lighter;
            color: rgb(138, 43, 226);
        }

        .updateDiv input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .updateDiv input:focus {
            outline: none;
            border-color: purple;
            background-color: #fdf6fd;
        }

        #confirmButton {
            background-color: blueviolet;
            border: 1px solid rgb(69, 69, 229);
            padding: 4px;
            border-radius: 4px;
            width: 100%;
            color: white;
        }

        #confirmButton:hover,
        #confirmButton:focus {
            outline: none;
            background-color: purple;
            border-color: rgb(69, 69, 229);
            box-shadow: 0 0 8px rgba(138, 43, 226, 0.5);
        }

        #confirmButton:active {
            transform: scale(0.98);
        }
    </style>
</head>

<body>
    <div class="container">
        <a class="logo" href="/">Blood<span>Nation</span>❤️</a>
        <h4 id="confirmHeading">Update your Password</h4>
        <form id="confirmForm">
            <div class="updateDiv">
                <label for="newConfirmPassword">New Password</label>
                <input type="password" id="newConfirmPassword" required>
            </div>

            <div class="updateDiv">
                <label for="confirmConfirmPassword">Confirm Password</label>
                <input type="password" id="confirmConfirmPassword" required>
            </div>
        </form>
        <button id="confirmButton">Update</button>
    </div>
</body>

</html>
