<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Activation</title>
    <!-- Google Fonts & CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh;
            background-image: linear-gradient(to right, rgb(165, 118, 165), purple);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 24px;
            font-weight: 700;
            text-decoration: none;
            color: purple;
            font-family: 'Poppins', sans-serif;
        }

        .logo span {
            color: purple;
        }


        .heart-icon {
            color: red;
            font-size: 18px;
        }

        .logo:hover,
        .logo:active {
            color: #f8a5c2;
        }

        .container {
            width: 600px;
            background-color: white;
            min-height: 300px;
            font: black;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        #loginRedirectButton {
            background-color: blueviolet;
            border: 1px solid rgb(69, 69, 229);
            padding: 4px;
            border-radius: 4px;
            width: 100%;
            color: white;
        }

        h3 {
            font-size: x-large;
        }

        #loginRedirectButton:hover,
        #loginRedirectButton:focus {
            outline: none;
            background-color: purple;
            border-color: rgb(69, 69, 229);
            box-shadow: 0 0 8px rgba(138, 43, 226, 0.5);
        }

        #loginRedirectButton:active {
            transform: scale(0.98);
        }
    </style>
</head>

<body>
    <div class="container">
        <a class="logo" href="/">Blood<span>Nation</span>❤️</a>
        <h3 style="color:rgb(138, 43, 226)">Activate your Account</h3>
        <h4 id="statusHeading"></h4>
        <h5 id="statusMessage"></h5>
        <button id="loginRedirectButton">Login</button>
    </div>
    <script src="activate.js" defer></script>
</body>

</html>
