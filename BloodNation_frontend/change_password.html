<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <!-- Google Fonts & CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: linear-gradient(to right, rgb(165, 118, 165), purple);
        }

        .container {
            width: 600px;
            height: 400px;
            border-radius: 8px;
            background-color: white;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 24px;
            font-weight: 700;
            text-decoration: none;
            color: purple;
            font-family: 'Poppins', sans-serif;
        }

        .logo span {
            color: purple;
        }


        .heart-icon {
            color: red;
            font-size: 18px;
        }

        .logo:hover,
        .logo:active {
            color: #f8a5c2;
        }

        #changeHeading {
            font-size: x-large;
            text-align: center;
            color: rgb(138, 43, 226);
            margin-top: 10px;
        }

        #changeForm {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: flex-start;
            width: 100%;
            height: 400px;
        }

        .changeDiv {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            margin-top: auto;
            margin-bottom: auto;
        }

        .changeDiv label {
            width: 80px;
            font-weight: lighter;
            color: rgb(138, 43, 226);
        }

        .changeDiv input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .changeDiv input:focus {
            outline: none;
            border-color: purple;
            background-color: #fdf6fd;
        }

        #btnChange {
            background-color: blueviolet;
            border: 1px solid rgb(69, 69, 229);
            padding: 4px;
            border-radius: 4px;
            width: 100%;
            color: white;
        }

        #btnChange:hover,
        #btnChange:focus {
            outline: none;
            background-color: purple;
            border-color: rgb(69, 69, 229);
            box-shadow: 0 0 8px rgba(138, 43, 226, 0.5);
        }

        #btnChange:active {
            transform: scale(0.98);
        }
    </style>
</head>

<body>
    <div class="container">
        <a class="logo" href="/">Blood<span>Nation</span>❤️</a>
        <h4 id="changeHeading">Change password</h4>
        <form id="changeForm">
            <div class="changeDiv">
                <label for="oldChange">Old Password</label>
                <input type="password" id="oldChange" required>
            </div>
            <div class="changeDiv">
                <label for="newChange">New Password</label>
                <input type="password" id="newChange" required>
            </div>
            <div class="changeDiv">
                <label for="confirmChange">Confirm Password</label>
                <input type="password" id="confirmChange" required>
            </div>

            <button type="submit" id="btnChange">Submit</button>
        </form>
    </div>

    <script src="JS/auth.js"></script>
    <script src="JS/change_password.js"></script>

</body>

</html>
