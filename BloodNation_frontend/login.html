<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register/Login</title>
    <!-- Google Fonts & CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="CSS/login.css">
</head>

<body>
    <header>
        <a class="logo" href="/">Blood<span>Nation</span>❤️</a>
        <nav>
            <ul class="navlist">
                <li><a href="home_page.html">Home</a></li>
                <li><a href="#aboutSection">About Us</a></li>
                <li><a href="#contactSection">Contact Us</a></li>
                <li><a href="login.html">Register/Login</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div id="containerFormOne">
            <h3>Register</h3>
            <div class="roleDiv">
                <label for="roleSelect">Select your role</label>
                <select name="roleSelect" id="roleSelect" required>
                    <option value="default">---------------</option>
                    <option value="doctor">Doctor</option>
                    <option value="patient">Patient</option>
                    <option value="donor">Donor</option>
                </select>
            </div>

            <form id="regFormDoctor" style="display: none;">
                <div class="labelInput">
                    <label for="regNameDoctor">Name</label>
                    <input type="text" id="regNameDoctor" name="name" autocomplete="name" required>
                </div>
                <div class="labelInput">
                    <label for="regEmailDoctor">Email</label>
                    <input type="email" id="regEmailDoctor" name="email" autocomplete="email" required>
                </div>
                <div class="labelInput">
                    <label for="regPasswordDoctor">Password</label>
                    <input type="password" id="regPasswordDoctor" name="password" required>
                </div>
                <div class="labelInput">
                    <label for="confirmPasswordDoctor">Confirm Password</label>
                    <input type="password" id="confirmPasswordDoctor" name="confirm_password" required>
                </div>
                <div class="labelInput">
                    <label for="specializationDoctor">Specialization</label>
                    <input type="text" id="specializationDoctor" name="specialization" required>
                </div>
                <div class="labelInput">
                    <label for="licenseDoctor">License Number</label>
                    <input type="text" id="licenseDoctor" name="license_number" required>
                </div>
                <button type="submit" id="regButtonDoctor">Doctor Register</button>
            </form>

            <form id="regFormDonor" style="display: none;">
                <div class="labelInput">
                    <label for="regNameDonor">Name</label>
                    <input type="text" id="regNameDonor" name="name" autocomplete="name" required>
                </div>
                <div class="labelInput">
                    <label for="regEmailDonor">Email</label>
                    <input type="email" id="regEmailDonor" name="email" autocomplete="email" required>
                </div>
                <div class="labelInput">
                    <label for="regPasswordDonor">Password</label>
                    <input type="password" id="regPasswordDonor" name="password" required>
                </div>
                <div class="labelInput">
                    <label for="confirmPasswordDonor">Confirm Password</label>
                    <input type="password" id="confirmPasswordDonor" name="confirm_password" required>
                </div>
                <div class="labelInput">
                    <label for="bloodDonor">Blood Group</label>
                    <input type="text" id="bloodDonor" name="blood_group" required>
                </div>
                <div class="labelInput">
                    <label for="lastdateDonor">Last Donation Date</label>
                    <input type="date" id="lastdateDonor" name="last_donation_date" required>
                </div>
                <button type="submit" id="regButtonDonor">Donor Register</button>
            </form>


            <form id="regFormPatient" style="display: none;">
                <div class="labelInput">
                    <label for="regNamePatient">Name</label>
                    <input type="text" id="regNamePatient" name="name" autocomplete="name" required>
                </div>
                <div class="labelInput">
                    <label for="regEmailPatient">Email</label>
                    <input type="email" id="regEmailPatient" name="email" autocomplete="email" required>
                </div>
                <div class="labelInput">
                    <label for="regPasswordPatient">Password</label>
                    <input type="password" id="regPasswordPatient" name="password" required>
                </div>
                <div class="labelInput">
                    <label for="confirmPasswordPatient">Confirm Password</label>
                    <input type="password" id="confirmPasswordPatient" name="confirm_password" required>
                </div>
                <div class="labelInput">
                    <label for="bloodPatient">Blood Group</label>
                    <input type="text" id="bloodPatient" name="blood_group_required" required>
                </div>
                <div class="labelInput">
                    <label for="historyPatient">Disease History</label>
                    <input type="text" id="historyPatient" name="disease_history" required>
                </div>
                <button type="submit" id="regButtonPatient">Patient Register</button>
            </form>
        </div>

        <div id="containerFormTwo">
            <h3>Login</h3>
            <form id="loginForm">
                <div id="labelDiv">
                    <div class="loginInput">
                        <label for="loginEmail">Email</label>
                        <input type="email" id="loginEmail" name="email" autocomplete="email" required>
                    </div>
                    <div class="loginInput">
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" name="password" required>
                    </div>
                </div>
                <button type="submit" id="loginButton">Login</button>
            </form>
        </div>
    </main>
    <script src="JS/login.js" defer></script>
</body>

</html>
